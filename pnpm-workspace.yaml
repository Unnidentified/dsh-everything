allowBuilds:
  # pnpm writes the "set this to true or false" placeholder here when a dependency
  # ships an install script with no decision yet, and with strictDepBuilds on by
  # default that placeholder makes every install fail with
  # ERR_PNPM_IGNORED_BUILDS. Both are decided up front: neither needs its script,
  # since protobufjs' postinstall only prints a message and @google/genai ships
  # prebuilt JS.
  '@google/genai': false
  protobufjs: false
