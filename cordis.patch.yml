# dsh-everything — the whole plugin set as one bundle layer.
#
# `dsh plugin --profile <name> add <this repo>` reads this file through
# package.json's `dsh.bundle.patch` and applies it after the base layer, so
# nothing has to be pasted into the profile's own cordis.patch.yml.
#
# Everything below is a single `insert:` list so each id appears exactly once.
# The packages under packages/*/cordis.patch.yml keep their own copies for the
# standalone install path. Install this bundle OR the individual packages, not
# both: two rows sharing one id still boot, but you end up with two copies of a
# plugin and no clear statement about which one wins.
#
# Rows carrying `config` restate it fully, because a targeting patch replaces
# `config` wholesale rather than merging into it.
#
# api keys are never stored here. Every provider row reads its key from an
# environment variable named in `apiKeyEnv`, or from the DSH credential store
# through its own Settings page. Nothing in this repo contains a key.
- insert:
  - id: antigravity-auth
    name: dsh-antigravity-auth
  - id: antigravity-search
    name: dsh-antigravity-auth/search
  - id: antigravity-image
    name: dsh-antigravity-auth/image
  - id: antigravity-video
    name: dsh-antigravity-auth/video
  - id: dsh-plugin
    name: dsh-plugin
  - id: exa-search
    name: dsh-plugin-exa-search
  - id: filesnap
    name: dsh-filesnap
  - id: llm-direct
    name: dsh-llm-direct
    config:
      providers:
        # Isoquant (api.isoquant.ai): an OpenAI-compatible router that publishes its
        # own catalog at /v1/models, including per-model pricing, context length and
        # the exact reasoning_effort values each model accepts. The rows below are
        # taken from that catalog, so the effort ladders are the ones upstream
        # documents rather than a guess: DeepSeek exposes none/low/high (default
        # high) and GLM exposes low/high/max with reasoning always on. Levels a
        # model does not list are left out, which sends nothing and lets the
        # provider apply its default.
        isoquant:
          displayName: Isoquant
          apiKeyEnv: ISOQUANT_API_KEY
          baseURL: https://api.isoquant.ai/v1
          endpoint: openai-chat
          reasoning: high
          contextWindow: 1048576
          defaultMaxTokens: 16384
          # Caching is automatic upstream (reported as cached input tokens), and the
          # API documents no retention field, so none is sent.
          cacheRetention: none
          reasoningEfforts:
            off: none
            low: low
            high: high
          models:
          - id: deepseek-v4.1-flash-1017
            # No spaces: a model name is shown verbatim in the picker, and spaces
            # are what the merge rows avoid too.
            name: DeepSeek-V4.1-Flash-1017
            contextWindow: 1048576
            maxTokens: 943718
            inputModalities:
            - text
            reasoningEfforts:
              off: none
              low: low
              medium: high
              high: high
          - id: glm-5.3-flash
            name: GLM-5.3-Flash
            contextWindow: 1048576
            maxTokens: 943718
            inputModalities:
            - text
            - image
            reasoningEfforts:
              off: null
              low: low
              medium: high
              high: high
              max: max
        concentrate-direct:
          displayName: Concentrate AI (direct)
          apiKeyEnv: CONCENTRATE_API_KEY
          baseURL: https://api.concentrate.ai/v1
          endpoint: openai-chat
          reasoning: high
          contextWindow: 1000000
          defaultMaxTokens: 393216
          cacheRetention: long
          reasoningEfforts:
            off: null
            low: low
            medium: medium
            high: high
            xhigh: xhigh
            max: max
          models:
          - id: deepseek/deepseek-v4-1-flash
            name: DeepSeek-V4.1-Flash-CachePinned
            contextWindow: 1000000
            maxTokens: 393216
            inputModalities:
            - text
            - image
            reasoningEfforts:
              off: null
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: deepseek-v4-1-flash
            name: DeepSeek-V4.1-Flash-AutoRouted
            contextWindow: 1000000
            maxTokens: 393216
            inputModalities:
            - text
            - image
            reasoningEfforts:
              off: null
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
        merge-direct:
          displayName: Merge#1
          apiKeyEnv: MERGE_GATEWAY_API_KEY
          baseURL: https://api-gateway.merge.dev/v1/anthropic
          endpoint: anthropic-messages
          reasoning: high
          contextWindow: 1000000
          defaultMaxTokens: 131072
          cacheControl: none
          reasoningEfforts:
            off: null
            low: low
            medium: medium
            high: high
            xhigh: xhigh
            max: max
          models:
          - id: deepseek/deepseek-v4.1-flash-1017
            name: DeepSeek-V4.1-Flash-Merge#1
            # Pinned to the vendor that serves this model's prompt cache. Left as
            # `particle`, requests landed on a vendor with a different (cold)
            # cache, so the cache hit rate collapsed on these routes.
            vendor: deepseek
            contextWindow: 1000000
            maxTokens: 384000
            inputModalities:
            - text
            - image
            reasoningEfforts:
              off: null
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: zai/glm-5.3-flash
            name: GLM5.3-Flash-Merge#1
            vendor: pareto
            contextWindow: 1000000
            maxTokens: 131072
            inputModalities:
            - text
            - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
        merge-direct-2:
          displayName: Merge#2
          apiKeyEnv: MERGE_GATEWAY_API_KEY_2
          baseURL: https://api-gateway.merge.dev/v1/anthropic
          endpoint: anthropic-messages
          reasoning: high
          contextWindow: 1000000
          defaultMaxTokens: 131072
          cacheControl: none
          reasoningEfforts:
            off: null
            low: low
            medium: medium
            high: high
            xhigh: xhigh
            max: max
          models:
          - id: deepseek/deepseek-v4.1-flash-1017
            name: DeepSeek-V4.1-Flash-Merge#2
            # Pinned to the vendor that serves this model's prompt cache. Left as
            # `particle`, requests landed on a vendor with a different (cold)
            # cache, so the cache hit rate collapsed on these routes.
            vendor: deepseek
            contextWindow: 1000000
            maxTokens: 384000
            inputModalities:
            - text
            - image
            reasoningEfforts:
              off: null
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: zai/glm-5.3-flash
            name: GLM5.3-Flash-Merge#2
            vendor: pareto
            contextWindow: 1000000
            maxTokens: 131072
            inputModalities:
            - text
            - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
  - id: loop-detector
    name: dsh-loop-detector
    config:
      minLen: 512
      maxRetries: 1
      checkReasoning: true
      searchTools:
      - web_search
      - mcp__exa__web_search_exa
  - id: provider-keys
    name: dsh-provider-keys

  - id: merge-preset
    name: dsh-merge-preset
    config:
      mountAdapter: false
  - id: move-session
    name: '@hucj/dsh-move-session'
  - id: natural-voice
    name: dsh-plugin-natural-voice
  # Ships DISABLED: an MCP server is a capability grant, not a default. Turning it
  # on is a deliberate act in Settings -> Provider keys -> Connections (or the
  # Plugins page), which also flips this same row rather than a shadow flag.
  - id: packet-tracer-mcp
    name: '@deepseek-ai/dsh-mcp-client'
    disabled: true
    config:
      serverName: packet-tracer
      transport: stdio
      command: !!js |-
        (function () {
          var fs = process.getBuiltinModule('fs');
          var path = process.getBuiltinModule('path');
          var cp = process.getBuiltinModule('child_process');
          var os = process.getBuiltinModule('os');
          // 1. An explicit override always wins.
          var override = process.env.DSH_PACKET_TRACER_PYTHON;
          if (override) return override;

          var home = process.env.HOME || process.env.USERPROFILE || '';
          var win = process.platform === 'win32';
          var root = path.join(home, '.local', 'share', 'dsh-mcp', 'packet-tracer');
          var bindir = path.join(root, win ? 'Scripts' : 'bin');
          var python = path.join(bindir, win ? 'python.exe' : 'python3');

          function importsIt(interpreter) {
            if (!interpreter) return false;
            try {
              // A bare command name has no separator; let the OS resolve it.
              if (/[\\/]/.test(interpreter) && !fs.existsSync(interpreter)) return false;
              var r = cp.spawnSync(interpreter, ['-c', 'import packet_tracer_mcp'], {
                stdio: 'ignore',
                timeout: 25000,
              });
              return r && r.status === 0;
            } catch (e) {
              return false;
            }
          }

          // 2. An interpreter that already has the module.
          if (importsIt(python)) return python;
          var system = win ? 'python' : 'python3';
          if (importsIt(system)) return system;

          // 3. Nothing usable. Start a one-time install in the background and return
          //    the venv path: a slow network must never block or fail startup, and the
          //    server connects on the next launch. The log is kept so a failure is
          //    inspectable instead of silent.
          try {
            var log = path.join(os.tmpdir(), 'dsh-packet-tracer-install.log');
            var fd = fs.openSync(log, 'a');
            fs.writeSync(fd, '[' + new Date().toISOString() + '] installing into ' + root + '\n');
            var pip = path.join(bindir, win ? 'pip.exe' : 'pip');
            var spec = '"mcp[cli]>=1.13,<2" "pydantic>=2.11,<3" packet-tracer-mcp';
            var script = win
              ? '"' + system + '" -m venv "' + root + '" && "' + pip + '" install ' + spec
              : system + ' -m venv "' + root + '" && "' + pip + '" install ' + spec;
            var child = cp.spawn(win ? (process.env.ComSpec || 'cmd.exe') : '/bin/sh', win ? ['/c', script] : ['-c', script], {
              detached: true,
              stdio: 'ignore',
              windowsHide: true,
            });
            if (child && child.unref) child.unref();
          } catch (e) {}
          return python;
        })()
      args:
      - -m
      - packet_tracer_mcp
      - --stdio
      failOnStartupError: true
  - id: reddit-playwright
    name: dsh-plugin-reddit-playwright
  - id: save-token
    name: dsh-plugin-save-token
    config:
      compressEnabled: true
      dedupeEnabled: true
      minBytes: 1400
      errorMinBytes: 6000
      minSavingBytes: 500
      keepRatioMax: 0.72
      maxLines: 240
      headLines: 140
      tailLines: 80
      tabularHeadRows: 60
      tabularTailRows: 40
      tabularStrideSamples: 50
      longLineChars: 420
      jsonMaxParseBytes: 524288
      jsonlMinLines: 8
      noticeFullTrailerCount: 3
      dedupeTtlMs: 600000
      dedupeTtlOverrides: {}
      compactAssistEnabled: false
      compactBudgetTokens: 120000
      compactCooldownMs: 600000
      contextWindowTokens: 0
      compactWatermarkRatio: 0.85
  - id: stalled-turn-continue
    name: dsh-stalled-turn-continue
  - id: theme-tuner
    name: dsh-plugin-theme-tuner
  - id: ui-tweaks
    name: dsh-client-ui-tweaks
  - id: usage-stats
    name: '@ychris12138/dsh-usage-stats'
    config:
      monitors:
        # The host registry publishes a route's id and name only, never the vendor
        # that serves it, so each merge route states its own. These mirror the
        # `vendor:` pins on the models under llm-direct above; the vendor test
        # fails if the two drift apart.
        merge-direct:
          adapter: merge-balance
          vendor: deepseek
        merge-direct-2:
          adapter: merge-balance
          vendor: deepseek
  - id: ui-workspace-archive-manager
    name: '@michengai/dsh-archive-manager'
  - id: vision-relay
    name: vision-relay
    config: {}
  - id: tool-recall
    name: dsh-compaction-instant/tool
  - id: command-recall
    name: dsh-compaction-instant/command
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  disabled: true
- id: llm-deepseek-account
  name: '@deepseek-ai/dsh-llm-deepseek-account'
  config:
    reasoningEffort: high
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: merge-direct-2
    model: deepseek/deepseek-v4.1-flash-1017
    reasoningEffort: high
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: ui-conversation
  name: '@deepseek-ai/dsh-client-ui-conversation'
  config:
    busyEnter: queue
- id: ui-chat
  name: '@deepseek-ai/dsh-client-ui-chat'
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: '@deepseek-ai/dsh-client-ui-settings'
  config:
    enabled: true
- id: ui-settings-account
  name: '@deepseek-ai/dsh-client-ui-settings-account'
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
- id: ui-message-feedback
  disabled: true
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: standard
    selectedDefault: standard
- id: ui-theme
  name: '@deepseek-ai/dsh-client-ui-theme'
  config:
    fontSize: 13
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
    maxParallelToolCalls: 10
# Local skills shipped with this bundle. The provider is separate from the one
# the agent preset mounts (default name "filesystem"), so this only adds a root
# instead of competing for the service. Resolve the path through createRequire
# so it lands in the INSTALLED copy under the profile, not this checkout.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  disabled: false
  config:
    providerName: bundle-skills
    customSkillDirs:
      - !!js >-
        process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-everything/package.json')), 'skills')
